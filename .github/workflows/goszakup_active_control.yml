name: Goszakup Active Lot -> Supabase

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pypdf

      - name: Extract PDF for ACTIVE control lot
        env:
          GOSZAKUP_TOKEN: ${{ secrets.GOSZAKUP_TOKEN }}
          CONTROL_LOT: "87872312-ОИ3"
          CONTROL_ANN: "17626528-1"
          EXPECTED_TEXT: "Steri-Gas 3M"
          CONTROL_FILE_OBJECT_ID: "43249288"
        run: python -u goszakup_active_control.py

      - name: Patch ONLY ACTIVE control lot raw.techspec in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPECTED_TEXT: "Steri-Gas 3M"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import requests

          root = Path('.')
          result_path = root / 'output_active_control' / 'active_control_result.json'
          text_path = root / 'output_active_control' / 'active_control_text.txt'

          if not result_path.exists() or not text_path.exists():
              raise SystemExit('ACTIVE CONTROL FAIL: diagnostic output is missing')

          result = json.loads(result_path.read_text(encoding='utf-8'))
          text = text_path.read_text(encoding='utf-8').strip()
          expected = os.environ.get('EXPECTED_TEXT', '').strip()

          if not result.get('ok'):
              raise SystemExit('ACTIVE CONTROL FAIL: PDF extraction test did not pass')
          if not expected:
              raise SystemExit('ACTIVE CONTROL FAIL: EXPECTED_TEXT is empty')
          if expected.lower() not in text.lower():
              raise SystemExit('ACTIVE CONTROL FAIL: expected marker missing from PDF text: ' + expected)

          lot = result.get('lot') or {}
          lot_id = str(lot.get('id') or '').strip()
          lot_number = str(lot.get('lotNumber') or '').strip()
          if not lot_id:
              raise SystemExit('ACTIVE CONTROL FAIL: GraphQL lot id is missing')

          base = os.environ['SUPABASE_URL'].rstrip('/')
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          endpoint = base + '/rest/v1/tenders'
          headers = {
              'apikey': key,
              'Authorization': 'Bearer ' + key,
              'Content-Type': 'application/json',
          }

          def get_rows(params):
              r = requests.get(endpoint, headers=headers, params=params, timeout=60)
              r.raise_for_status()
              return r.json()

          rows = get_rows({
              'select': 'source_code,source_lot_id,source_tender_id,raw',
              'source_code': 'eq.goszakup',
              'source_lot_id': 'eq.' + lot_id,
              'limit': '1',
          })

          if not rows and lot_number:
              rows = get_rows({
                  'select': 'source_code,source_lot_id,source_tender_id,raw',
                  'source_code': 'eq.goszakup',
                  'raw->>lot_number': 'eq.' + lot_number,
                  'limit': '1',
              })

          if not rows:
              raise SystemExit('ACTIVE CONTROL FAIL: active lot row not found in Supabase')

          row = rows[0]
          source_lot_id = str(row.get('source_lot_id') or '').strip()
          raw = row.get('raw') if isinstance(row.get('raw'), dict) else {}
          tech = raw.get('techspec') if isinstance(raw.get('techspec'), dict) else {}
          tech_file = result.get('tech_file') or {}

          tech['technical_requirements'] = text
          tech['pdf_extracted'] = True
          tech['pdf_text_length'] = len(text)
          tech['pdf_source'] = (result.get('pdf_source') or {}).get('final_url') or (result.get('pdf_source') or {}).get('url')
          tech['pdf_original_name'] = tech_file.get('originalName')
          tech['pdf_active_control'] = True
          tech['has_techspec_file'] = True
          raw['techspec'] = tech

          patch_headers = dict(headers)
          patch_headers['Prefer'] = 'return=representation'
          patch = requests.patch(
              endpoint,
              headers=patch_headers,
              params={'source_code': 'eq.goszakup', 'source_lot_id': 'eq.' + source_lot_id},
              json={'raw': raw},
              timeout=60,
          )
          patch.raise_for_status()

          changed = patch.json()
          if not changed:
              raise SystemExit('ACTIVE CONTROL FAIL: Supabase PATCH changed 0 rows')

          verify = get_rows({
              'select': 'source_lot_id,raw',
              'source_code': 'eq.goszakup',
              'source_lot_id': 'eq.' + source_lot_id,
              'limit': '1',
          })
          if not verify:
              raise SystemExit('ACTIVE CONTROL FAIL: row disappeared after PATCH')

          saved = (((verify[0].get('raw') or {}).get('techspec') or {}).get('technical_requirements') or '')
          if expected.lower() not in saved.lower():
              raise SystemExit('ACTIVE CONTROL FAIL: Supabase read-back does not contain: ' + expected)

          print()
          print('=' * 72)
          print('ACTIVE CONTROL PASS: API -> PDF -> SUPABASE')
          print('=' * 72)
          print('LOT:', lot_number, 'DB KEY:', source_lot_id)
          print('ANNOUNCEMENT:', result.get('control_announcement'))
          print('EXPECTED:', expected, 'FOUND=True')
          print('PDF:', tech_file.get('originalName'), 'objectId=', tech_file.get('objectId'))
          print('PDF TEXT CHARS:', len(text))
          print('Only this one existing Goszakup row was patched.')
          print('=' * 72)
          PY

      - name: Upload active control diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goszakup-active-control-diagnostics
          path: output_active_control/
          if-no-files-found: warn

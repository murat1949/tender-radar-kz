name: Goszakup Active Lot -> Supabase

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pypdf

      - name: Extract PDF for ACTIVE control lot
        env:
          GOSZAKUP_TOKEN: ${{ secrets.GOSZAKUP_TOKEN }}
          CONTROL_LOT: "87872312-ОИ3"
          CONTROL_ANN: "17626528-1"
          EXPECTED_TEXT: "Steri-Gas 3M"
          CONTROL_FILE_OBJECT_ID: ""
        run: python -u goszakup_active_control.py

      - name: Patch ONLY ACTIVE control lot raw.techspec in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTROL_LOT: "87872312-ОИ3"
          CONTROL_ANN: "17626528-1"
          EXPECTED_TEXT: "Steri-Gas 3M"
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          import requests

          root = Path('.')
          result_path = root / 'output_active_control' / 'active_control_result.json'
          text_path = root / 'output_active_control' / 'active_control_text.txt'

          if not result_path.exists() or not text_path.exists():
              raise SystemExit('ACTIVE CONTROL FAIL: diagnostic output is missing')

          result = json.loads(result_path.read_text(encoding='utf-8'))
          text = text_path.read_text(encoding='utf-8').strip()

          if not result.get('ok'):
              raise SystemExit('ACTIVE CONTROL FAIL: PDF extraction result is not OK')

          expected = os.environ.get('EXPECTED_TEXT', '').strip()
          if expected and expected.lower() not in text.lower():
              raise SystemExit(f'ACTIVE CONTROL FAIL: {expected} missing from PDF text')

          lot = result.get('lot') or {}
          lot_id = str(lot.get('id') or '').strip()
          lot_number = str(lot.get('lotNumber') or '').strip()
          control_lot = os.environ.get('CONTROL_LOT', '').strip()
          control_ann = os.environ.get('CONTROL_ANN', '').strip()

          if not lot_id:
              raise SystemExit('ACTIVE CONTROL FAIL: GraphQL lot id is missing')

          def lot_prefix(value):
              m = re.search(r'\d{6,}', str(value or ''))
              return m.group(0) if m else ''

          target_prefix = lot_prefix(control_lot or lot_number)

          base = os.environ['SUPABASE_URL'].rstrip('/')
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          endpoint = base + '/rest/v1/tenders'
          headers = {
              'apikey': key,
              'Authorization': 'Bearer ' + key,
              'Content-Type': 'application/json',
          }

          def get_rows(params):
              r = requests.get(endpoint, headers=headers, params=params, timeout=60)
              r.raise_for_status()
              return r.json()

          # Primary production key: GraphQL lot id.
          rows = get_rows({
              'select': 'source_code,source_lot_id,source_tender_id,raw',
              'source_code': 'eq.goszakup',
              'source_lot_id': 'eq.' + lot_id,
              'limit': '1',
          })

          # Robust fallback: same announcement, then select by numeric lot prefix.
          if not rows and control_ann:
              candidates = get_rows({
                  'select': 'source_code,source_lot_id,source_tender_id,raw',
                  'source_code': 'eq.goszakup',
                  'source_tender_id': 'eq.' + control_ann,
                  'limit': '100',
              })
              matched = []
              for row in candidates:
                  raw = row.get('raw') if isinstance(row.get('raw'), dict) else {}
                  raw_lot = raw.get('lot_number') or raw.get('lotNumber') or ''
                  if target_prefix and lot_prefix(raw_lot) == target_prefix:
                      matched.append(row)
              if matched:
                  rows = [matched[0]]

          # Older-row fallback: exact lot number stored inside raw JSON.
          if not rows and lot_number:
              rows = get_rows({
                  'select': 'source_code,source_lot_id,source_tender_id,raw',
                  'source_code': 'eq.goszakup',
                  'raw->>lot_number': 'eq.' + lot_number,
                  'limit': '1',
              })

          if not rows:
              raise SystemExit(
                  f'ACTIVE CONTROL FAIL: existing Supabase row not found for '
                  f'id={lot_id}, lot={lot_number}, announcement={control_ann}. '
                  'Nothing was inserted or changed.'
              )

          row = rows[0]
          source_lot_id = str(row.get('source_lot_id') or '').strip()
          raw = row.get('raw') if isinstance(row.get('raw'), dict) else {}
          tech = raw.get('techspec') if isinstance(raw.get('techspec'), dict) else {}

          tech_file = result.get('tech_file') or {}
          verification = result.get('verification') or {}
          pdf_source = result.get('pdf_source') or {}

          tech['technical_requirements'] = text
          tech['pdf_extracted'] = True
          tech['pdf_text_length'] = len(text)
          tech['pdf_source'] = pdf_source.get('final_url') or pdf_source.get('url')
          tech['pdf_original_name'] = tech_file.get('originalName')
          tech['pdf_object_id'] = tech_file.get('objectId')
          tech['pdf_control_markers'] = verification
          tech['has_techspec_file'] = True
          raw['techspec'] = tech

          patch_headers = dict(headers)
          patch_headers['Prefer'] = 'return=representation'
          patch = requests.patch(
              endpoint,
              headers=patch_headers,
              params={
                  'source_code': 'eq.goszakup',
                  'source_lot_id': 'eq.' + source_lot_id,
              },
              json={'raw': raw},
              timeout=60,
          )
          patch.raise_for_status()
          changed = patch.json()
          if not changed:
              raise SystemExit('ACTIVE CONTROL FAIL: Supabase PATCH changed 0 rows')

          verify = get_rows({
              'select': 'source_lot_id,raw',
              'source_code': 'eq.goszakup',
              'source_lot_id': 'eq.' + source_lot_id,
              'limit': '1',
          })
          if not verify:
              raise SystemExit('ACTIVE CONTROL FAIL: row disappeared after PATCH')

          saved = (((verify[0].get('raw') or {}).get('techspec') or {}).get('technical_requirements') or '')
          if expected and expected.lower() not in saved.lower():
              raise SystemExit(
                  f'ACTIVE CONTROL FAIL: Supabase read-back does not contain {expected}'
              )

          report = {
              'ok': True,
              'source_lot_id': source_lot_id,
              'lot_number': lot_number,
              'announcement': control_ann,
              'expected_text': expected,
              'pdf_text_length': len(saved),
              'pdf_original_name': tech_file.get('originalName'),
              'pdf_object_id': tech_file.get('objectId'),
              'message': 'API -> PDF -> Supabase PASSED. Only the active control lot raw.techspec was changed.',
          }
          out = root / 'output_active_control' / 'active_control_supabase_result.json'
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')

          print('\n' + '=' * 72)
          print('ACTIVE CONTROL PASS: API -> PDF -> SUPABASE')
          print('LOT:', lot_number, 'DB KEY:', source_lot_id)
          print('ANNOUNCEMENT:', control_ann)
          print('EXPECTED:', expected, 'FOUND=True')
          print('PDF:', tech_file.get('originalName'), 'objectId=', tech_file.get('objectId'))
          print('PDF TEXT CHARS:', len(saved))
          print('Only this one existing Goszakup row was patched.')
          print('=' * 72)
          PY

      - name: Upload active control diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goszakup-active-control
          path: output_active_control/
          if-no-files-found: warn
